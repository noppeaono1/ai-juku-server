function TypingText({ text }) {
  const [displayed, setDisplayed] = useState("");
  const [done, setDone] = useState(false);
  useEffect(() => {
    setDisplayed(""); setDone(false);
    let i = 0;
    const iv = setInterval(() => {
      if (i < text.length) { setDisplayed(text.slice(0, i+1)); i++; }
      else { setDone(true); clearInterval(iv); }
    }, 18);
    return () => clearInterval(iv);
  }, [text]);
  return React.createElement(React.Fragment, null, displayed, !done && React.createElement("span", {className:"cursor"}, "|"));
}

function Bubble({ msg }) {
  const isUser = msg.role === "user";
  return React.createElement("div", {
    style: { display:"flex", justifyContent: isUser?"flex-end":"flex-start", marginBottom:16, animation:"fadeIn .3s ease" }
  },
    !isUser && React.createElement("div", { style:{ width:40,height:40,borderRadius:"50%",background:"linear-gradient(135deg,#667eea,#764ba2)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:20,marginRight:10,flexShrink:0,marginTop:4 } }, "🤖"),

}
