const SUPERSCRIPTS = { "0":"⁰","1":"¹","2":"²","3":"³","4":"⁴","5":"⁵","6":"⁶","7":"⁷","8":"⁸","9":"⁹","-":"⁻" };
const SUBSCRIPTS = { "0":"₀","1":"₁","2":"₂","3":"₃","4":"₄","5":"₅","6":"₆","7":"₇","8":"₈","9":"₉","-":"₋" };
const GREEK_LETTERS = {
  alpha:"α", beta:"β", gamma:"γ", delta:"δ", epsilon:"ε", theta:"θ", lambda:"λ",
  mu:"μ", pi:"π", sigma:"σ", phi:"φ", omega:"ω",
  Delta:"Δ", Sigma:"Σ", Omega:"Ω", Pi:"Π", Theta:"Θ", Lambda:"Λ", Phi:"Φ",
};

// 文字列の各文字に結合文字（オーバーライン・ドットなど）を付与する
function addCombiningMark(str, mark) {
  return [...str].map(c => c + mark).join("");
}

function toSuperscript(digits) {
  return [...digits].map(d => SUPERSCRIPTS[d] || d).join("");
}

function toSubscript(digits) {
  return [...digits].map(d => SUBSCRIPTS[d] || d).join("");
}

// LaTeXの数式記法を読みやすいテキストに変換（循環小数の\overline・\dotにも対応）
function latexMathToText(m) {
  let out = m
    .replace(/\\frac\{([^{}]+)\}\{([^{}]+)\}/g, "($1/$2)")
    .replace(/\\overline\{([^{}]+)\}/g, (_, s) => addCombiningMark(s, "̅"))
    .replace(/\\ddot\{([^{}]+)\}/g, (_, s) => addCombiningMark(s, "̈"))
    .replace(/\\dot\{([^{}]+)\}/g, (_, s) => addCombiningMark(s, "̇"))
    .replace(/\\text\{([^{}]+)\}/g, "$1")
    .replace(/\\left([([{])/g, "$1")
    .replace(/\\right([)\]}])/g, "$1")
    .replace(/\\cdot/g, "・")
    .replace(/\\times/g, "×")
    .replace(/\\div/g, "÷")
    .replace(/\\pm/g, "±")
    .replace(/\\leq/g, "≤")
    .replace(/\\geq/g, "≥")
    .replace(/\\neq/g, "≠")
    .replace(/\\approx/g, "≈")
    .replace(/\\infty/g, "∞")
    .replace(/\\sum/g, "Σ")
    .replace(/\\int/g, "∫")
    .replace(/\\sqrt\{([^{}]+)\}/g, "√($1)")
    .replace(/\\([a-zA-Z]+)/g, (_, name) => GREEK_LETTERS[name] || name)
    .replace(/\^\{(-?[0-9]+)\}/g, (_, d) => toSuperscript(d))
    .replace(/\^(-?[0-9]+)/g, (_, d) => toSuperscript(d))
    .replace(/_\{(-?[0-9]+)\}/g, (_, d) => toSubscript(d))
    .replace(/_(-?[0-9]+)/g, (_, d) => toSubscript(d));
  return out;
}

function formatMessage(text) {
  if (!text) return "";
  return latexMathToText(text)
    // LaTeX数式を読みやすく変換
    .replace(/\$\$([^$]+)\$\$/g, (_, m) => latexMathToText(m).replace(/\\/g, "").trim())
    .replace(/\$([^$]+)\$/g, (_, m) => latexMathToText(m).replace(/\\/g, "").trim())
    // Markdownを変換
    .replace(/### (.+)/g, "📌 $1")
    .replace(/## (.+)/g, "📌 $1")
    .replace(/# (.+)/g, "📌 $1")
    .replace(/\*\*(.+?)\*\*/g, "$1")
    .replace(/\*(.+?)\*/g, "$1")
    .replace(/^- /gm, "• ")
    .replace(/^---$/gm, "──────")
    // 正解・不正解を目立たせる(「不正解」の中の「正解」を誤って⭕に変換しないよう「不」も除外する)
    .replace(/不正解/g, "❌ 不正解")
    .replace(/(?<![⭕❌不])正解(?!！)/g, "⭕️ 正解！");
}
